appjars.i18nmanager.demo.tour.home.actions.desc=Ces deux boutons ouvrent les vues de l'appjar : le catalogue de langues et l'éditeur de traductions de la langue par défaut. Le menu voisin lance la visite guidée de l'une ou de l'autre — le même menu se trouve dans la barre de navigation, vous pouvez donc lancer une visite depuis n'importe où.
appjars.i18nmanager.demo.tour.home.actions.title=Ouvrir les vues
appjars.i18nmanager.demo.tour.home.features.desc=Une carte par capacité : le catalogue de langues, l'éditeur de traductions, l'import et l'export de fichiers de propriétés standard, l'analyse qui trouve les clés que personne n'a encore traduites, et le fait que tout cela prend effet sans redéploiement.
appjars.i18nmanager.demo.tour.home.features.title=Ce que l'appjar vous apporte
appjars.i18nmanager.demo.tour.home.intro.desc=Cet appjar permet à une application de gérer ses propres langues et traductions pendant qu'elle tourne. Cette page est la carte : voyons ce qu'elle contient et par où commencer.
appjars.i18nmanager.demo.tour.home.intro.title=Bienvenue dans la démo I18N Manager
appjars.i18nmanager.demo.tour.home.license.desc=Cette démo tourne sans licence, ce qui la limite à 2 langues et 100 traductions par langue. Rien d'autre n'est bridé : toutes les fonctionnalités que vous venez de voir sont les complètes.
appjars.i18nmanager.demo.tour.home.license.title=Ce que signifie ici le mode gratuit
appjars.i18nmanager.demo.tour.home.tryit.desc=Cette section est la partie pratique. L'anglais contient déjà les textes de cette page, l'éditeur n'est donc pas vide sur une base de données neuve, et deux fichiers de propriétés d'exemple sont fournis pour l'espagnol et le français. Elle explique aussi comment voir la démo elle-même dans une autre langue.
appjars.i18nmanager.demo.tour.home.tryit.title=Par où commencer
appjars.i18nmanager.demo.tour.languages.actions.desc=Nous venons d'ouvrir pour vous le menu d'actions de la langue par défaut (chaque ligne en possède un, et un clic droit sur une ligne affiche les mêmes options). Depuis ici, vous pouvez :<ul><li><b>Définir par défaut</b> — faire de cette langue le repli pour les traductions manquantes.</li><li><b>Modifier la langue</b> — changer sa clé, son nom ou sa région.</li><li><b>Éléments de traduction</b> — ouvrir l'éditeur de traductions de cette langue.</li><li><b>Analyser les clés manquantes</b> — découvrir les clés utilisées par l'application qui ne sont pas encore traduites.</li><li><b>Importer les valeurs</b> — importer un fichier de propriétés standard dans cette langue.</li><li><b>Télécharger les valeurs</b> — exporter cette langue sous forme de fichier de propriétés.</li><li><b>Supprimer la langue</b> — retirer la langue et ses traductions.</li></ul>
appjars.i18nmanager.demo.tour.languages.actions.title=Actions de langue
appjars.i18nmanager.demo.tour.languages.filters.desc=Saisissez une clé ou un nom et appuyez sur Filtrer pour affiner la liste.
appjars.i18nmanager.demo.tour.languages.filters.title=Filtrer les langues
appjars.i18nmanager.demo.tour.languages.grid.desc=Toutes les langues prises en charge par votre application sont listées ici, avec leur clé, leur région facultative et celle par défaut.
appjars.i18nmanager.demo.tour.languages.grid.title=Catalogue de langues
appjars.i18nmanager.demo.tour.languages.intro.desc=C'est ici que vous déclarez les langues que parle votre application. Faisons le tour — vous pouvez quitter la visite à tout moment.
appjars.i18nmanager.demo.tour.languages.intro.title=La vue des langues
appjars.i18nmanager.demo.tour.languages.locale.desc=La démo elle-même s'affiche dans celle de ces langues que demande votre navigateur : ce catalogue est donc aussi la façon de changer la langue de l'application qui vous entoure. Créez la langue, importez-y un fichier de propriétés avec <b>Importer les valeurs</b>, puis placez-la en premier dans les préférences linguistiques de votre navigateur et ouvrez la démo dans une nouvelle fenêtre privée. La langue est négociée une fois par session, donc recharger cet onglet conserve la langue actuelle.
appjars.i18nmanager.demo.tour.languages.locale.title=Voir l'application traduite
appjars.i18nmanager.demo.tour.languages.new.desc=Cliquez sur Nouvelle langue pour enregistrer une autre langue : donnez-lui une clé (p. ex. es), une région facultative et un nom d'affichage ; elle apparaît ensuite dans le catalogue, prête pour les traductions.
appjars.i18nmanager.demo.tour.languages.new.title=Ajouter une langue
appjars.i18nmanager.demo.tour.progress=Étape {0} sur {1}
appjars.i18nmanager.demo.tour.translations.filters.desc=Filtrez par clé ou par texte de traduction pour localiser rapidement l'élément dont vous avez besoin.
appjars.i18nmanager.demo.tour.translations.filters.title=Trouver une clé
appjars.i18nmanager.demo.tour.translations.grid.desc=Chaque ligne est une clé de traduction avec sa valeur pour la langue sélectionnée. Double-cliquez sur une ligne pour la modifier en ligne.
appjars.i18nmanager.demo.tour.translations.grid.title=Éléments de traduction
appjars.i18nmanager.demo.tour.translations.intro.desc=Voici l'éditeur des traductions d'une langue : créez des clés, modifiez les valeurs en ligne et importez ou exportez des fichiers de propriétés standard. Faisons le tour.
appjars.i18nmanager.demo.tour.translations.intro.title=La vue des traductions
appjars.i18nmanager.demo.tour.translations.more.desc=Nous venons d'ouvrir pour vous le bouton <b>Plus</b>. Il regroupe les actions de gestion des clés :<ul><li><b>Nouvel élément</b> — créer une clé de traduction manuellement.</li><li><b>Analyser les clés manquantes</b> — analyse les bundles de ressources de l'application à la recherche de clés qui ne sont pas encore dans la base de données et vous permet de les importer, afin que rien ne reste non traduit.</li><li><b>Supprimer la sélection</b> — retire les clés sélectionnées dans la grille (disponible sur la langue par défaut).</li></ul>
appjars.i18nmanager.demo.tour.translations.more.title=Le menu Plus
