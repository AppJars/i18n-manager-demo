appjars.i18nmanager.demo.tour.home.actions.desc=Estos dos botones abren las vistas del appjar: el catálogo de idiomas y el editor de traducciones del idioma predeterminado. El menú que está al lado inicia el recorrido guiado de cualquiera de ellas — el mismo menú está en la barra de navegación, así que puede iniciar un recorrido desde cualquier lugar.
appjars.i18nmanager.demo.tour.home.actions.title=Abrir las vistas
appjars.i18nmanager.demo.tour.home.features.desc=Una tarjeta por cada capacidad: el catálogo de idiomas, el editor de traducciones, la importación y exportación de archivos de propiedades estándar, el escaneo que encuentra claves que nadie tradujo todavía, y el hecho de que todo ello se aplica sin volver a desplegar.
appjars.i18nmanager.demo.tour.home.features.title=Qué le ofrece el appjar
appjars.i18nmanager.demo.tour.home.intro.desc=Este appjar permite que una aplicación gestione sus propios idiomas y traducciones mientras se ejecuta. Esta página es el mapa: veamos qué hay en ella y por dónde empezar.
appjars.i18nmanager.demo.tour.home.intro.title=Bienvenido a la demo de I18N Manager
appjars.i18nmanager.demo.tour.home.license.desc=Esta demo se ejecuta sin licencia, lo que la limita a 2 idiomas y 100 traducciones por idioma. Nada más está restringido: todas las funcionalidades que acaba de ver son las completas.
appjars.i18nmanager.demo.tour.home.license.title=Qué significa aquí el modo gratuito
appjars.i18nmanager.demo.tour.home.tryit.desc=Esta sección es la parte práctica. El inglés ya contiene los textos de esta página, así que el editor no está vacío en una base de datos nueva, y se incluyen dos archivos de propiedades de ejemplo para español y francés. También explica cómo ver la demo misma en otro idioma.
appjars.i18nmanager.demo.tour.home.tryit.title=Por dónde empezar
appjars.i18nmanager.demo.tour.languages.actions.desc=Acabamos de abrir por usted el menú de acciones del idioma predeterminado (cada fila tiene uno, y al hacer clic derecho sobre una fila se muestran las mismas opciones). Desde aquí puede:<ul><li><b>Establecer como predeterminado</b> — hacer que este idioma sea el respaldo para las traducciones faltantes.</li><li><b>Editar idioma</b> — cambiar su clave, nombre o región.</li><li><b>Elementos de traducción</b> — abrir el editor de traducciones de este idioma.</li><li><b>Escanear claves faltantes</b> — descubrir claves que usa la aplicación y que aún no están traducidas.</li><li><b>Subir valores</b> — importar un archivo de propiedades estándar a este idioma.</li><li><b>Descargar valores</b> — exportar este idioma como un archivo de propiedades.</li><li><b>Eliminar idioma</b> — quitar el idioma y sus traducciones.</li></ul>
appjars.i18nmanager.demo.tour.languages.actions.title=Acciones de idioma
appjars.i18nmanager.demo.tour.languages.filters.desc=Escriba una clave o un nombre y presione Filtrar para acotar la lista.
appjars.i18nmanager.demo.tour.languages.filters.title=Filtrar idiomas
appjars.i18nmanager.demo.tour.languages.grid.desc=Aquí se listan todos los idiomas que admite su aplicación, con su clave, región opcional y cuál es el predeterminado.
appjars.i18nmanager.demo.tour.languages.grid.title=Catálogo de idiomas
appjars.i18nmanager.demo.tour.languages.intro.desc=Aquí se declara qué idiomas habla su aplicación. Hagamos un recorrido — puede salir en cualquier momento.
appjars.i18nmanager.demo.tour.languages.intro.title=La vista de idiomas
appjars.i18nmanager.demo.tour.languages.locale.desc=La demo misma se muestra en aquel de estos idiomas que pida su navegador, así que este catálogo también es la forma de cambiar el idioma de la aplicación que lo rodea. Cree el idioma, cargue en él un archivo de propiedades con <b>Subir valores</b>, luego póngalo primero en las preferencias de idioma de su navegador y abra la demo en una nueva ventana privada. El idioma se negocia una vez por sesión, así que recargar esta pestaña mantiene el actual.
appjars.i18nmanager.demo.tour.languages.locale.title=Ver la aplicación traducida
appjars.i18nmanager.demo.tour.languages.new.desc=Haga clic en Nuevo idioma para registrar otro idioma: asígnele una clave (p. ej. es), una región opcional y un nombre para mostrar; luego aparece en el catálogo listo para traducciones.
appjars.i18nmanager.demo.tour.languages.new.title=Agregar un idioma
appjars.i18nmanager.demo.tour.progress=Paso {0} de {1}
appjars.i18nmanager.demo.tour.translations.filters.desc=Filtre por clave o por texto de traducción para ubicar rápidamente el elemento que necesita.
appjars.i18nmanager.demo.tour.translations.filters.title=Buscar una clave
appjars.i18nmanager.demo.tour.translations.grid.desc=Cada fila es una clave de traducción con su valor para el idioma seleccionado. Haga doble clic en una fila para editarla en línea.
appjars.i18nmanager.demo.tour.translations.grid.title=Elementos de traducción
appjars.i18nmanager.demo.tour.translations.intro.desc=Este es el editor de traducciones de un idioma: cree claves, edite valores en línea e importe o exporte archivos de propiedades estándar. Hagamos un recorrido.
appjars.i18nmanager.demo.tour.translations.intro.title=La vista de traducciones
appjars.i18nmanager.demo.tour.translations.more.desc=Acabamos de abrir por usted el botón <b>Más</b>. Agrupa las acciones de gestión de claves:<ul><li><b>Nuevo elemento</b> — crear una clave de traducción a mano.</li><li><b>Escanear claves faltantes</b> — escanea los paquetes de recursos de la aplicación en busca de claves que aún no están en la base de datos y le permite importarlas, para que nada quede sin traducir.</li><li><b>Eliminar seleccionados</b> — quita las claves seleccionadas en la grilla (disponible en el idioma predeterminado).</li></ul>
appjars.i18nmanager.demo.tour.translations.more.title=El menú Más
