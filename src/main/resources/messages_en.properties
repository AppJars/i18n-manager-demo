# Home (landing page)
appjars.i18nmanager.demo.home.title=I18N Manager Demo
appjars.i18nmanager.demo.home.hero.title=I18N Manager
appjars.i18nmanager.demo.home.hero.tagline=Manage your application''s languages and translations at runtime, from the application itself — no property files to redeploy.
appjars.i18nmanager.demo.home.features.title=What''s inside
appjars.i18nmanager.demo.home.features.languages.title=Language catalog
appjars.i18nmanager.demo.home.features.languages.desc=Create the languages your application supports, with optional regions, and choose which one is the default.
appjars.i18nmanager.demo.home.features.translations.title=Translation editor
appjars.i18nmanager.demo.home.features.translations.desc=Browse and edit every translation key per language in a grid, right from the running application.
appjars.i18nmanager.demo.home.features.importexport.title=Import & export
appjars.i18nmanager.demo.home.features.importexport.desc=Upload existing messages properties files into a language and download any language back as a standard properties file.
appjars.i18nmanager.demo.home.features.scankeys.title=Missing-key scan
appjars.i18nmanager.demo.home.features.scankeys.desc=Scan the application''s resource bundles to discover untranslated keys and fill the gaps.
appjars.i18nmanager.demo.home.features.runtime.title=Runtime updates
appjars.i18nmanager.demo.home.features.runtime.desc=Translations live in the database and are served through a Vaadin I18NProvider: changes apply immediately, without redeploying.
appjars.i18nmanager.demo.home.features.persistence.title=Persistent datastore
appjars.i18nmanager.demo.home.features.persistence.desc=Languages and translations are stored through JPA in your own database — H2 in this demo, any dialect in production.
appjars.i18nmanager.demo.home.features.configurable.title=Configurable
appjars.i18nmanager.demo.home.features.configurable.desc=View routes and the properties-file encoding are configurable through application properties.
appjars.i18nmanager.demo.home.tryit.title=Try it now
appjars.i18nmanager.demo.home.tryit.intro=This demo needs no login: open the views below and start managing languages and translations right away. Every edit applies to the running application immediately, with nothing to redeploy.
appjars.i18nmanager.demo.home.tryit.preloaded=English comes with the texts of this landing page already loaded, so the translation editor is not empty: edit one of those rows and the change shows up here immediately. To bring in every other key the application uses, open the English language and run Scan missing keys.
appjars.i18nmanager.demo.home.tryit.samples=The demo ships sample translation files — create the language and load one through Upload Values to see the app translated:
appjars.i18nmanager.demo.home.tryit.samples.es=Spanish
appjars.i18nmanager.demo.home.tryit.samples.fr=French
appjars.i18nmanager.demo.home.tryit.language=The demo renders in whichever of its languages your browser asks for. To see it in Spanish or French: create the language above, load its sample file through Upload Values, put that language first in your browser''s preferences, and open the demo in a new private window — the language is chosen once per session, so reloading this tab keeps the current one.
