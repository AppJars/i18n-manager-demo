appjars.i18nmanager.demo.tour.progress=Step {0} of {1}
appjars.i18nmanager.demo.tour.home.intro.title=Welcome to the I18N Manager demo
appjars.i18nmanager.demo.tour.home.intro.desc=This appjar lets an application manage its own languages and translations while it runs. This page is the map — let''s see what is on it, and where to start.
appjars.i18nmanager.demo.tour.home.features.title=What the appjar gives you
appjars.i18nmanager.demo.tour.home.features.desc=One card per capability: the language catalog, the translation editor, import and export of standard properties files, the scan that finds keys nobody translated yet, and the fact that all of it takes effect without a redeploy.
appjars.i18nmanager.demo.tour.home.tryit.title=Where to start
appjars.i18nmanager.demo.tour.home.tryit.desc=This section is the hands-on part. English already holds the texts of this page, so the editor is not empty on a fresh database, and two sample properties files are bundled for Spanish and French. It also explains how to see the demo itself in another language.
appjars.i18nmanager.demo.tour.home.actions.title=Opening the views
appjars.i18nmanager.demo.tour.home.actions.desc=These two buttons open the appjar''s views: the language catalog, and the translation editor for the default language. The menu next to them starts the guided tour of either one — the same menu sits in the navigation bar, so you can run a tour from anywhere.
appjars.i18nmanager.demo.tour.home.license.title=What free mode means here
appjars.i18nmanager.demo.tour.home.license.desc=This demo runs unlicensed, which caps it at 2 languages and 100 translations per language. Nothing else is held back: every feature you just saw is the full one.
appjars.i18nmanager.demo.tour.languages.intro.title=The languages view
appjars.i18nmanager.demo.tour.languages.intro.desc=This is where you declare which languages your application speaks. Let''s walk through it — you can leave the tour at any time.
appjars.i18nmanager.demo.tour.languages.grid.title=Language catalog
appjars.i18nmanager.demo.tour.languages.grid.desc=Every language your application supports is listed here, with its key, optional region and which one is the default.
appjars.i18nmanager.demo.tour.languages.filters.title=Filter languages
appjars.i18nmanager.demo.tour.languages.filters.desc=Type a key or a name and press Filter to narrow down the list.
appjars.i18nmanager.demo.tour.languages.new.title=Add a language
appjars.i18nmanager.demo.tour.languages.new.desc=Click New language to register another language — give it a key (e.g. es), an optional region and a display name; it then appears in the catalog ready for translations.
appjars.i18nmanager.demo.tour.languages.actions.title=Language actions
appjars.i18nmanager.demo.tour.languages.actions.desc=We just opened the actions menu of the first language for you (every row has one, and right-clicking a row shows the same options). From here you can:<ul><li><b>Set as default</b> — make this language the fallback for missing translations.</li><li><b>Edit language</b> — change its key, name or region.</li><li><b>Translations items</b> — open the translation editor for this language.</li><li><b>Scan missing keys</b> — discover keys used by the application that are not translated yet.</li><li><b>Upload Values</b> — import a standard properties file into this language.</li><li><b>Download Values</b> — export this language as a properties file.</li><li><b>Delete language</b> — remove the language and its translations.</li></ul>
appjars.i18nmanager.demo.tour.languages.locale.title=Seeing the app translated
appjars.i18nmanager.demo.tour.languages.locale.desc=The demo itself renders in whichever of these languages your browser asks for, so this catalog is also how you change the language of the application around you. Create the language, load a properties file into it through <b>Upload Values</b>, then put it first in your browser''s language preferences and open the demo in a new private window. The language is negotiated once per session, so reloading this tab keeps the one you are on.
appjars.i18nmanager.demo.tour.translations.intro.title=The translations view
appjars.i18nmanager.demo.tour.translations.intro.desc=This is the editor for the translations of one language: create keys, edit values inline and import or export standard properties files. Let''s walk through it.
appjars.i18nmanager.demo.tour.translations.grid.title=Translation items
appjars.i18nmanager.demo.tour.translations.grid.desc=Each row is a translation key with its value for the selected language. Double-click a row to edit it inline.
appjars.i18nmanager.demo.tour.translations.filters.title=Find a key
appjars.i18nmanager.demo.tour.translations.filters.desc=Filter by key or by translation text to quickly locate the item you need.
appjars.i18nmanager.demo.tour.translations.more.title=The More menu
appjars.i18nmanager.demo.tour.translations.more.desc=We just opened the <b>More</b> button for you. It groups the key-management actions:<ul><li><b>New item</b> — create a translation key by hand.</li><li><b>Scan missing keys</b> — scans the application''s resource bundles for keys that are not in the database yet and lets you import them, so nothing is left untranslated.</li><li><b>Delete selected</b> — removes the keys selected in the grid (available on the default language).</li></ul>
