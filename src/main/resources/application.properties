# ============================================================
# Datasource
# ============================================================

# File-based H2, so the languages and translations the evaluator creates survive a restart.
# FILE_LOCK=NO lets a second run reuse the file after an unclean shutdown.
spring.datasource.url=jdbc:h2:./data/i18nmanagerdb;FILE_LOCK=NO
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
# Left empty on purpose: this is a throwaway local database and the demo is public.
spring.datasource.password=

# Browse the demo's own tables at http://localhost:8080/h2-console (JDBC URL above, user sa,
# no password). Set to false if you would rather not expose it.
spring.h2.console.enabled=true

# Hibernate creates and updates the appjar's tables on startup; no migration scripts to run.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true

# Spring's own default, stated explicitly so it is a decision rather than a startup warning.
spring.jpa.open-in-view=true

# ============================================================
# I18N Manager - view routes
# ============================================================
# Every property below is listed so it is visible what can be configured, each set to the value
# the demo runs on. The appjar reads them with @Value("${property:default}"), where an empty but
# present value wins over the default — so these carry their default explicitly rather than being
# left blank.

# Base route for the translation items view
com.appjars.i18nmanager.url.views.translationitems=i18n/items

# Route of the translation items view for one language, with the language as a parameter
com.appjars.i18nmanager.url.views.translationitemsparams=i18n/items/:lang

# Route for the languages view
com.appjars.i18nmanager.url.views.languages=i18n/languages

# ============================================================
# I18N Manager - resource bundle loading
# ============================================================

# Charset used to decode messages_<locale>.properties when they are scanned by "Scan missing
# keys" or uploaded through the translation items view. Any charset name Java accepts.
# Note the JDK default for Properties.load(InputStream) is ISO-8859-1; this setting defaults
# to UTF-8 instead. Set it to ISO-8859-1 only for bundles that rely on the legacy decoding.
com.appjars.i18nmanager.properties.encoding=UTF-8

# ============================================================
# I18N Manager - translation keys
# ============================================================

# Maximum length accepted for a translation key, enforced by the service layer and by the key
# field in the translation items view.
com.appjars.i18nmanager.key.max-length=255

# ============================================================
# I18N Manager - locale resolution
# ============================================================

# Locale used to look up translations when no better match is available.
com.appjars.i18nmanager.default-locale=en

# Re-resolves the session locale from Accept-Language whenever a UI is initialized, so a reload
# picks up a language the evaluator has just created. The demo needs this: its languages are
# added at runtime rather than declared up front.
# Default: false
com.appjars.i18nmanager.auto-resolve-locale=true

# Locales whose bundles are preloaded. Declared by appjars-utils and shared with the other
# AppJars, so it is namespaced com.appjars.utils (the "i8n" typo is part of the real name).
# These are the languages this demo ships texts for.
com.appjars.utils.i8n.supportedLocales=en,es,fr

# ============================================================
# Logging
# ============================================================

logging.level.org.hibernate=info
