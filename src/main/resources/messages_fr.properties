# Demo's own texts in French. The appjar's own translations are deliberately not here:
# importing them from sample-translations/messages_fr.properties is what Upload values demonstrates.
#
# Values here are MessageFormat patterns, so a literal apostrophe is written doubled ('').
# The files under sample-translations/ are loaded into the database instead, which serves them
# verbatim, so those keep single apostrophes. Do not "sync" the two.
