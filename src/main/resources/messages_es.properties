appjars.i18nmanager.demo.home.tour.languages=Vista de idiomas
appjars.i18nmanager.demo.home.tour.translations=Vista de traducciones
appjars.i18nmanager.demo.home.license.title=Licencia gratuita vs. completa
appjars.i18nmanager.demo.home.license.desc=Esta demo se ejecuta en modo gratuito: todas las funcionalidades están completas, limitadas a 2 idiomas y 100 traducciones por idioma. Una licencia completa elimina los límites; nada más cambia.
appjars.i18nmanager.demo.home.license.link=Obtenga una licencia en appjars.com
appjars.i18nmanager.demo.home.links.title=Más información
appjars.i18nmanager.demo.home.links.github=AppJars en GitHub
appjars.i18nmanager.demo.home.links.readme=Documentación de I18N Manager
