appjars.i18nmanager.demo.home.title=I18N Manager Demo
appjars.i18nmanager.demo.home.hero.title=I18N Manager
appjars.i18nmanager.demo.home.hero.tagline=Gestione los idiomas y las traducciones de su aplicación en tiempo de ejecución, desde la propia aplicación: sin archivos de propiedades que volver a desplegar.
appjars.i18nmanager.demo.home.features.title=Qué incluye
appjars.i18nmanager.demo.home.features.languages.title=Catálogo de idiomas
appjars.i18nmanager.demo.home.features.languages.desc=Cree los idiomas que admite su aplicación, con regiones opcionales, y elija cuál es el predeterminado.
appjars.i18nmanager.demo.home.features.translations.title=Editor de traducciones
appjars.i18nmanager.demo.home.features.translations.desc=Explore y edite cada clave de traducción por idioma en una grilla, desde la propia aplicación en ejecución.
appjars.i18nmanager.demo.home.features.importexport.title=Importar y exportar
appjars.i18nmanager.demo.home.features.importexport.desc=Suba archivos de propiedades de mensajes existentes a un idioma y descargue cualquier idioma como un archivo de propiedades estándar.
appjars.i18nmanager.demo.home.features.scankeys.title=Escaneo de claves faltantes
appjars.i18nmanager.demo.home.features.scankeys.desc=Escanee los paquetes de recursos de la aplicación para descubrir claves sin traducir y completar los faltantes.
appjars.i18nmanager.demo.home.features.runtime.title=Actualizaciones en tiempo de ejecución
appjars.i18nmanager.demo.home.features.runtime.desc=Las traducciones viven en la base de datos y se sirven mediante un I18NProvider de Vaadin: los cambios se aplican de inmediato, sin volver a desplegar.
appjars.i18nmanager.demo.home.features.persistence.title=Almacén persistente
appjars.i18nmanager.demo.home.features.persistence.desc=Los idiomas y las traducciones se almacenan mediante JPA en su propia base de datos: H2 en esta demo, cualquier dialecto en producción.
appjars.i18nmanager.demo.home.features.configurable.title=Configurable
appjars.i18nmanager.demo.home.features.configurable.desc=Las rutas de las vistas y la codificación de los archivos de propiedades se configuran mediante las propiedades de la aplicación.
appjars.i18nmanager.demo.home.tryit.title=Pruébelo ahora
appjars.i18nmanager.demo.home.tryit.intro=Esta demo no requiere inicio de sesión: abra las vistas de abajo y comience a gestionar idiomas y traducciones de inmediato. Cada cambio se aplica de inmediato a la aplicación en ejecución, sin nada que volver a desplegar.
appjars.i18nmanager.demo.home.tryit.preloaded=El inglés ya viene con los textos de esta página cargados, así el editor de traducciones no está vacío: edite una de esas filas y el cambio aparece aquí de inmediato. Para incorporar el resto de las claves que usa la aplicación, abra el idioma inglés y ejecute Escanear claves faltantes.
appjars.i18nmanager.demo.home.tryit.samples=La demo incluye archivos de traducción de ejemplo — cree el idioma y cargue uno con Subir valores para ver la aplicación traducida:
appjars.i18nmanager.demo.home.tryit.samples.es=Español
appjars.i18nmanager.demo.home.tryit.samples.fr=Francés
appjars.i18nmanager.demo.home.tryit.language=La demo se muestra en aquel de sus idiomas que pida su navegador. Para verla en español o francés: cree el idioma arriba, cargue su archivo de ejemplo con Subir valores, ponga ese idioma primero en las preferencias de su navegador y abra la demo en una nueva ventana privada — el idioma se elige una vez por sesión, así que recargar esta pestaña mantiene el actual.
appjars.i18nmanager.demo.home.tryit.languages=Gestionar idiomas
appjars.i18nmanager.demo.home.tryit.translations=Editar traducciones
